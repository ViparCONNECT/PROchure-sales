    <script type="text/javascript">
      (function (l) {
        // Restore a saved deep-link route from the GitHub Pages 404 redirect
        var saved = sessionStorage.getItem("gh-redirect");
        if (saved) {
          sessionStorage.removeItem("gh-redirect");
          window.history.replaceState(null, null, saved);
          return;
        }

        // Legacy ?/ fallback
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })(window.location);
